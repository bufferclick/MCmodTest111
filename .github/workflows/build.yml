name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          {
            echo "checkout HEAD: $(git rev-parse HEAD)"
            echo "screen file: $(sha256sum src/client/java/dev/karn/karnmining/gui/BlockSelectionScreen.java | cut -c1-12)"
          } | tee "$GITHUB_WORKSPACE/build.log"
          ./gradlew build --console=plain 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KarnMining-${{ github.sha }}
          path: |
            build/libs/*.jar
            build.log
            !build/libs/*-sources.jar

      # Push a tag like v1.0.0 to publish a release with the jar attached.
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/karnmining-*.jar
          generate_release_notes: true

      # The built jar is also pushed to the dist branch so it can be fetched
      # with a plain git pull.
      - name: Push jar to dist branch
        if: success() && !startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "karnmining-ci"
          git config user.email "karnmining-ci@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p dist
          cp build/libs/karnmining-*.jar dist/
          cp src/main/resources/assets/karnmining/icon.png dist/icon.png 2>/dev/null || true
          git add dist
          git commit -m "KarnMining build ${{ github.sha }}" || true
          git push origin HEAD:dist --force

      # On failure the Gradle log is pushed to the ci-logs branch so it can
      # be fetched with a plain git pull.
      - name: Push build log to ci-logs branch (on failure)
        if: failure()
        run: |
          git config user.name "karnmining-ci"
          git config user.email "karnmining-ci@users.noreply.github.com"
          [ -f build.log ] || exit 0
          git checkout --orphan ci-log-$$
          git add build.log
          git commit -m "ci: build log for ${{ github.sha }}"
          git push origin HEAD:ci-logs --force
